<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draw a Circle</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <h1 class="game-title">Circle Drawing Game</h1>
      <div class="canvas-wrapper">
        <canvas id="circleCanvas"></canvas>

        <!-- Real-time HUD -->
        <div id="progress-hud" class="hud">Draw a continuous circle</div>

        <!-- Top Huddle Result Card (Non-blocking) -->
        <div id="huddle-card" class="huddle-card hidden">
          <div class="huddle-left">
            <div class="score-badge"><span id="score-val">0.0</span><span class="pct">%</span></div>
          </div>

          <div class="huddle-stats">
            <div class="stat-item">
              <span class="stat-label">Aspect</span>
              <span id="stat-aspect" class="stat-val">1.00</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Radius Dev</span>
              <span id="stat-variance" class="stat-val">0.0%</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Isoperimetric</span>
              <span id="stat-iso" class="stat-val">0.00</span>
            </div>
          </div>

          <button id="submit-btn" class="huddle-btn">Submit Score</button>
        </div>
      </div>
    </div>

    <script src="dist/script.js"></script>
  </body>
</html>
